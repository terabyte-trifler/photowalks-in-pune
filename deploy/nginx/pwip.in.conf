# ============================================================================
# nginx — pwip.in
# ----------------------------------------------------------------------------
# Install as /etc/nginx/sites-available/pwip.in and symlink into
# sites-enabled. Certbot rewrites the listen/ssl lines in place the first time
# it runs (`certbot --nginx -d pwip.in -d www.pwip.in`), so install this file
# BEFORE issuing the certificate and let certbot edit it, rather than pasting
# TLS directives here by hand.
#
# What this file deliberately does NOT do: send security headers. Every one of
# them — HSTS, X-Content-Type-Options, Referrer-Policy, Permissions-Policy —
# comes from next.config.ts, and the CSP is minted per request in middleware
# because it carries a nonce. Adding them here too would produce two values
# for the same header, and browsers resolve that by taking the strictest, so
# the effective policy would stop matching either file.
# ============================================================================

# --- www -> apex -------------------------------------------------------------
# One canonical origin. NEXT_PUBLIC_SITE_URL, the Supabase redirect allow-list
# and the Open Graph URLs all say https://pwip.in; a site reachable at both
# splits sessions across two cookie domains and duplicates every page for
# search engines.
server {
    listen 80;
    listen [::]:80;
    server_name www.pwip.in;
    return 308 https://pwip.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name pwip.in;

    # certbot replaces this block's listen lines with 443/ssl and adds its own
    # port-80 redirect. Until then, plain HTTP is what answers.

    # Photograph uploads go from the browser straight to Supabase Storage and
    # never traverse nginx, but avatar posts and server actions do. Next's own
    # body limit is what actually governs; this only stops nginx refusing first
    # with a 413 that never reaches the app's error handling.
    client_max_body_size 12M;

    # Next compresses nothing itself. These are the types that benefit; images
    # and fonts are already compressed and re-running gzip on them costs CPU
    # for nothing.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/manifest+json
        image/svg+xml;

    # ------------------------------------------------------------------------
    # Immutable build assets. Every file under /_next/static carries a content
    # hash in its name, so a given URL's bytes can never change and a year is
    # not a risk. Served straight from disk — there is no reason for these to
    # wake the node process at all.
    # ------------------------------------------------------------------------
    location /_next/static/ {
        alias /home/pwip/pwip/.next/standalone/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ------------------------------------------------------------------------
    # Everything else, including /_next/image. The optimiser has to run in
    # node — it reads from Supabase and from /public and re-encodes — so it
    # cannot be short-circuited here. next.config.ts's minimumCacheTTL is what
    # keeps those responses cached now that the site is self-hosted.
    # ------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Without these four, every request looks to Next like plain HTTP from
        # 127.0.0.1. That breaks the absolute URLs it builds, and — because the
        # Supabase auth cookies are Secure — silently breaks sign-in.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A cold server action or an image being encoded for the first time can
        # take a few seconds; nginx's 60s default is generous enough, stated
        # here so it is a decision rather than an inheritance.
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
